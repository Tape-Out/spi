ip: spi
contract: { aw: 8, dw: 32 }
base: 0x10005000
size: 0x100
params: [fifoDepth, csWidth]
regs:
  - name: sckdiv
    offset: 0x00
    desc: clock divisor
    fields: [ { name: val, width: 12, sw: rw, hw: r, reset: 3 } ]
  - name: sckmode
    offset: 0x04
    desc: clock polarity and phase
    fields:
      - { name: pha, bits: "0:0", sw: rw, hw: r, reset: 0 }
      - { name: pol, bits: "1:1", sw: rw, hw: r, reset: 0 }
  # 19.8：HOLD 按住的片选在 csid、csmode 写进不同的值，或 csdef 改到选中那一根时放开。
  # 看的是值变没变，写同一个值不算，所以不要写脉冲
  - name: csid
    offset: 0x10
    desc: chip select index
    fields: [ { name: val, width: csWidth, sw: rw, hw: r, reset: 0 } ]
  # 19.7：各根片选的非活动电平，复位全一。-1 按字段宽度取二补码
  - name: csdef
    offset: 0x14
    desc: chip select inactive levels
    fields: [ { name: val, width: csWidth, sw: rw, hw: r, reset: -1 } ]
  - name: csmode
    offset: 0x18
    desc: chip select behaviour
    fields: [ { name: val, bits: "1:0", sw: rw, hw: r, reset: 0 } ]
  # 19.9：四段延时，单位是一个 SCK 周期
  - name: delay0
    offset: 0x28
    desc: chip select to clock, and clock to chip select release
    fields:
      - { name: cssck, bits: "7:0",   sw: rw, hw: r, reset: 1 }
      - { name: sckcs, bits: "23:16", sw: rw, hw: r, reset: 1 }
  - name: delay1
    offset: 0x2C
    desc: chip select inactive time, and gap between held frames
    fields:
      - { name: intercs,  bits: "7:0",   sw: rw, hw: r, reset: 1 }
      - { name: interxfr, bits: "23:16", sw: rw, hw: r, reset: 0 }
  - name: fmt
    offset: 0x40
    desc: frame format
    feature: quad
    fields:
      - { name: proto, bits: "1:0",  sw: rw, hw: r, reset: 0 }
      - { name: endian, bits: "2:2", sw: rw, hw: r, reset: 0 }
      - { name: dir,   bits: "3:3",  sw: rw, hw: r, reset: 0 }
      - { name: len,   bits: "19:16", sw: rw, hw: r, reset: 8 }
  - name: txdata
    offset: 0x48
    desc: transmit, write pushes
    fields:
      - { name: data, bits: "7:0",   sw: w, hw: r, swmod: true }
      - { name: full, bits: "31:31", sw: r, hw: w, volatile: true }
  - name: rxdata
    offset: 0x4C
    desc: receive, read pops
    fields:
      - { name: data,  bits: "7:0",   sw: r, hw: w, volatile: true, swacc: true }
      - { name: empty, bits: "31:31", sw: r, hw: w, volatile: true }
  # 19.13/19.14：水线门限。没有它们，ie/ip 的两位就没有意义。
  - name: txmark
    offset: 0x50
    desc: transmit watermark threshold
    fields: [ { name: val, bits: "2:0", sw: rw, hw: r, reset: 0 } ]
  - name: rxmark
    offset: 0x54
    desc: receive watermark threshold
    fields: [ { name: val, bits: "2:0", sw: rw, hw: r, reset: 0 } ]

  - name: ie
    offset: 0x70
    desc: interrupt enable
    fields:
      - { name: txwm, bits: "0:0", sw: rw, hw: r, reset: 0 }
      - { name: rxwm, bits: "1:1", sw: rw, hw: r, reset: 0 }
  - name: ip
    offset: 0x74
    desc: interrupt pending
    fields:
      - { name: txwm, bits: "0:0", sw: r, hw: w, volatile: true }
      - { name: rxwm, bits: "1:1", sw: r, hw: w, volatile: true }
